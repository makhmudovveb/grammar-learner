<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Grammar Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2340;
  --ink-soft:#4A5178;
  --paper:#F3F4F9;
  --surface:#FFFFFF;
  --line:#E1E3F0;
  --accent:#EF6351;
  --accent-soft:#FDEAE6;
  --teal:#1E9E8B;
  --teal-soft:#E1F5F1;
  --amber:#E7A73B;
  --amber-soft:#FBF1DD;
  --good:#1E9E5C;
  --good-soft:#E4F7EC;
  --bad:#E14F4F;
  --bad-soft:#FCE9E9;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow:0 2px 14px rgba(28,35,64,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Sora',sans-serif;}
.app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  position:relative;
}
/* ---- top bar ---- */
.topbar{
  padding:18px 20px 0 20px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .mark{
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:-0.01em;
}
.brand .sub{
  font-size:12.5px;
  color:var(--ink-soft);
}
.langswitch{
  display:flex;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  gap:2px;
  flex-shrink:0;
}
.langswitch button{
  border:none;
  background:transparent;
  padding:6px 10px;
  border-radius:999px;
  font-family:'Sora',sans-serif;
  font-weight:600;
  font-size:12px;
  color:var(--ink-soft);
  cursor:pointer;
  transition:background .15s, color .15s;
}
.langswitch button.active{
  background:var(--ink);
  color:#fff;
}
/* ---- tabs ---- */
.tabs{
  margin:18px 20px 4px 20px;
  display:flex;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
}
.tabs button{
  flex:1;
  border:none;
  background:transparent;
  padding:10px 12px;
  border-radius:999px;
  font-family:'Sora',sans-serif;
  font-weight:600;
  font-size:14px;
  color:var(--ink-soft);
  cursor:pointer;
  transition:background .18s,color .18s;
}
.tabs button.active{
  background:var(--ink);
  color:#fff;
}
.view{
  padding:16px 20px 40px 20px;
  flex:1;
}
.section-label{
  font-size:13px;
  color:var(--ink-soft);
  margin:10px 2px 12px 2px;
}
/* ---- topic grid (folder style) ---- */
.folder-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.folder-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px 14px;
  cursor:pointer;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:112px;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.folder-card:active{transform:scale(.97);}
.folder-card:hover{box-shadow:var(--shadow);border-color:transparent;}
.folder-icon{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:700;font-size:15px;
  color:#fff;
}
.folder-card .fname{
  font-family:'Sora',sans-serif;
  font-weight:600;
  font-size:14.5px;
  line-height:1.3;
}
.t0 .folder-icon{background:var(--accent);}
.t1 .folder-icon{background:var(--teal);}
.t2 .folder-icon{background:var(--amber);}
.t3 .folder-icon{background:var(--ink);}
/* ---- detail panel (chat style) ---- */
.panel{
  animation:slideIn .22s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.backrow{
  display:flex;align-items:center;gap:8px;
  margin-bottom:14px;
  cursor:pointer;
  color:var(--ink-soft);
  font-size:14px;
  font-weight:600;
  width:fit-content;
}
.backrow svg{flex-shrink:0;}
.panel-title{
  font-size:21px;
  font-weight:700;
  margin:0 0 14px 0;
}
.chat{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.bubble{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:13px 15px;
  font-size:14.5px;
  line-height:1.55;
  max-width:92%;
}
.bubble.example{
  background:var(--teal-soft);
  border-color:transparent;
  font-style:normal;
  border-left:3px solid var(--teal);
  color:#12463d;
}
.bubble b{font-family:'Sora',sans-serif;}
.teacher-row{display:flex;gap:9px;align-items:flex-start;}
.avatar{
  width:30px;height:30px;border-radius:50%;
  background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
  flex-shrink:0;margin-top:2px;
}
/* ---- exercise type cards ---- */
.type-list{display:flex;flex-direction:column;gap:10px;}
.type-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  transition:border-color .15s, transform .12s;
}
.type-card:active{transform:scale(.98);}
.type-card:hover{border-color:var(--ink);}
.type-badge{
  width:40px;height:40px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:700;color:#fff;font-size:16px;
  flex-shrink:0;
}
.type-info .tname{font-family:'Sora',sans-serif;font-weight:600;font-size:15px;}
.type-info .tdesc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.type-arrow{margin-left:auto;color:var(--ink-soft);flex-shrink:0;}
/* ---- quiz ---- */
.progress-wrap{
  display:flex;align-items:center;gap:10px;
  margin-bottom:18px;
}
.progress-bar{
  flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--ink);border-radius:99px;
  transition:width .2s ease;
}
.progress-text{font-size:12.5px;color:var(--ink-soft);font-weight:600;flex-shrink:0;}
.qcard{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
  margin-bottom:12px;
}
.qcard .qnum{
  font-family:'Sora',sans-serif;font-weight:700;font-size:12px;
  color:var(--ink-soft);margin-bottom:6px;
}
.qcard .qtext{font-size:15px;line-height:1.5;margin-bottom:12px;}
.qcard .qtext .blank{
  display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-soft);
  text-align:center;
}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt-list.chips{flex-direction:row;flex-wrap:wrap;}
.opt{
  border:1.5px solid var(--line);
  background:var(--paper);
  border-radius:var(--radius-sm);
  padding:10px 13px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  text-align:left;
  transition:border-color .12s, background .12s;
}
.opt-list.chips .opt{border-radius:999px;padding:8px 15px;}
.opt.selected{border-color:var(--ink);background:#fff;font-weight:600;}
.opt.correct{border-color:var(--good);background:var(--good-soft);font-weight:600;}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.opt[disabled],.opt.locked{cursor:default;}
.fill-row{display:flex;align-items:center;gap:8px;}
.fill-input{
  flex:1;
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px 13px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  background:var(--paper);
}
.fill-input:focus{outline:none;border-color:var(--ink);background:#fff;}
.fill-input.correct{border-color:var(--good);background:var(--good-soft);}
.fill-input.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.qbadge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;margin-top:10px;
  padding:4px 10px;border-radius:999px;
}
.qbadge.correct{background:var(--good-soft);color:var(--good);}
.qbadge.incorrect{background:var(--bad-soft);color:var(--bad);}
.qbadge .why{
  cursor:pointer;
  width:17px;height:17px;border-radius:50%;
  background:var(--bad);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;margin-left:2px;
}
.action-bar{
  position:sticky;bottom:0;
  background:linear-gradient(to top, var(--paper) 65%, rgba(243,244,249,0));
  padding:18px 0 6px 0;
  margin-top:6px;
}
.btn{
  width:100%;
  border:none;
  background:var(--ink);
  color:#fff;
  font-family:'Sora',sans-serif;
  font-weight:600;
  font-size:15px;
  padding:14px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:opacity .15s;
}
.btn:active{opacity:.85;}
.btn.ghost{
  background:var(--surface);
  border:1.5px solid var(--line);
  color:var(--ink);
}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
/* ---- result ---- */
.result-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:28px 20px;
  text-align:center;
  margin-bottom:16px;
}
.result-score{
  font-family:'Sora',sans-serif;font-weight:700;font-size:44px;
  margin:6px 0;
}
.result-title{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;}
.result-sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}
/* ---- modal ---- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(28,35,64,0.45);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@media (min-width:601px){.modal-overlay{align-items:center;}}
.modal{
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:22px 22px 26px 22px;
  max-width:480px;width:100%;
  animation:slideUp .2s ease;
}
@media (min-width:601px){.modal{border-radius:20px;}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal h3{margin:0 0 10px 0;font-size:16px;}
.modal p{margin:0 0 18px 0;font-size:14.5px;line-height:1.55;color:var(--ink-soft);}
.modal .close-btn{
  width:100%;border:none;background:var(--paper);color:var(--ink);
  font-family:'Sora',sans-serif;font-weight:600;font-size:14px;
  padding:12px;border-radius:var(--radius-sm);cursor:pointer;
}
::selection{background:var(--accent-soft);}

/* ---- verbs tab ---- */
.verb-row{
  display:grid;
  grid-template-columns:1.1fr 1.1fr 1.3fr 1fr;
  gap:6px;
  padding:10px 8px;
  font-size:13px;
  border-bottom:1px solid var(--line);
  align-items:center;
}
.verb-row.verb-head{
  font-family:'Sora',sans-serif;
  font-weight:600;
  font-size:11.5px;
  color:var(--ink-soft);
  border-bottom:1.5px solid var(--ink);
}
.verb-row .v1{font-weight:700;font-family:'Sora',sans-serif;}
.verb-row .vm{color:var(--ink-soft);}
.verb-rows{
  max-height:56vh;
  overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:0 6px;
}
.verb-empty{padding:24px;text-align:center;color:var(--ink-soft);}
.verb-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:34px 20px;
  text-align:center;
  margin-bottom:16px;
}
.verb-v1{
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:34px;
}
.streak-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Sora',sans-serif;font-weight:600;font-size:12.5px;
  background:var(--amber-soft);color:#8a5a12;
  padding:6px 12px;border-radius:999px;
  margin-bottom:14px;
}
</style>
</head>

let state = {
  lang: "en",
  tab: "theory",
  view: {name:"grid"}, // grid | theory | types | quiz | result | verbsHome | verbsList | verbsGame | verbsResult
  topic: null,
  exType: null,
  answers: {}, // idx -> selected value
  checked: false,
  verbsSearch: "",

};

function t(){ return T[state.lang]; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = "";
  app.appendChild(renderTopbar());
  app.appendChild(renderTabs());
  const view = document.createElement('div');
  view.className = 'view';
  view.appendChild(renderCurrentView());
  app.appendChild(view);
}

function renderTopbar(){
  const bar = el(`<div class="topbar">
    <div class="brand">
      <div class="mark">${t().title}</div>
      <div class="sub">${t().subtitle}</div>
    </div>
    <div class="langswitch">
      ${["en","ru","uz"].map(l=>`<button data-lang="${l}" class="${state.lang===l?'active':''}">${l.toUpperCase()}</button>`).join("")}
    </div>
  </div>`);
  bar.querySelectorAll('button[data-lang]').forEach(b=>{
    b.onclick = ()=>{ state.lang = b.dataset.lang; render(); };
  });
  return bar;
}

function renderTabs(){
  const bar = el(`<div class="tabs">
    <button data-tab="theory" class="${state.tab==='theory'?'active':''}">${t().tabTheory}</button>
    <button data-tab="practice" class="${state.tab==='practice'?'active':''}">${t().tabPractice}</button>
    <button data-tab="verbs" class="${state.tab==='verbs'?'active':''}">${t().tabVerbs}</button>
  </div>`);
  bar.querySelectorAll('button[data-tab]').forEach(b=>{
    b.onclick = ()=>{
      state.tab = b.dataset.tab;
      state.topic = null; state.exType = null;
      state.view = state.tab === "verbs" ? {name:"verbsHome"} : {name:"grid"};
      render();
    };
  });
  return bar;
}

function renderCurrentView(){
  if (state.view.name === "grid") return renderGrid();
  if (state.view.name === "theory") return renderTheoryPanel();
  if (state.view.name === "types") return renderTypesPanel();
  if (state.view.name === "quiz") return renderQuizPanel();
  if (state.view.name === "result") return renderResultPanel();
  if (state.view.name === "verbsHome") return renderVerbsHome();
  if (state.view.name === "verbsList") return renderVerbsList();
  if (state.view.name === "verbsGame") return renderVerbsGame();
  if (state.view.name === "verbsResult") return renderVerbsResult();
  return document.createElement('div');
}

function renderQuizPanel(){
  const wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.appendChild(backRow(t().backToTypes, ()=>{ state.view={name:"types"}; render(); }));
  wrap.appendChild(el(`<h2 class="panel-title">${t().topics[state.topic]} · ${t().exTypes[state.exType]}</h2>`));

  const items = currentItems();
  const answeredCount = Object.keys(state.answers).length;
  wrap.appendChild(el(`<div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" style="width:${(answeredCount/items.length)*100}%"></div></div>
    <div class="progress-text">${answeredCount}/${items.length}</div>
  </div>`));

  items.forEach((item, idx)=>{
    wrap.appendChild(renderQuestion(item, idx));
  });

  const actionBar = el(`<div class="action-bar"></div>`);
  if (!state.checked){
    const btn = el(`<button class="btn">${t().check}</button>`);
    btn.onclick = ()=>{ state.checked = true; render(); scoreIntoResult(); };
    actionBar.appendChild(btn);
  } else {
    const row = el(`<div class="btn-row">
      <button class="btn ghost" id="retryBtn">${t().retry}</button>
      <button class="btn" id="viewResultBtn">${t().score}</button>
    </div>`);
    actionBar.appendChild(row);
  }
  wrap.appendChild(actionBar);

  if (state.checked){
    wrap.querySelector('#retryBtn').onclick = ()=>{ state.answers={}; state.checked=false; render(); };
    wrap.querySelector('#viewResultBtn').onclick = ()=>{ state.view={name:"result"}; render(); };
  }

  return wrap;
}

function isCorrect(item, idx){
  const val = state.answers[idx];
  if (val === undefined) return false;
  if (item.accept){
    return item.accept.map(a=>a.toLowerCase().trim()).includes(String(val).toLowerCase().trim());
  }
  return val === item.correct;
}

function renderQuestion(item, idx){
  const qcard = el(`<div class="qcard"></div>`);
  qcard.appendChild(el(`<div class="qnum">${t().questionOf(idx+1, currentItems().length)}</div>`));
  qcard.appendChild(el(`<div class="qtext">${item.q.replace("___",'<span class="blank">___</span>')}</div>`));

  if (item.accept){
    const row = el(`<div class="fill-row"></div>`);
    const input = el(`<input type="text" class="fill-input" placeholder="${t().typeAnswer}">`);
    if (state.answers[idx] !== undefined) input.value = state.answers[idx];
    input.disabled = state.checked;
    input.oninput = ()=>{ state.answers[idx] = input.value; syncProgress(); };
    if (state.checked){
      input.classList.add(isCorrect(item, idx) ? "correct" : "incorrect");
    }
    row.appendChild(input);
    qcard.appendChild(row);
  } else {
    const isChips = state.exType === "choice";
    const optList = el(`<div class="opt-list ${isChips?'chips':''}"></div>`);
    item.options.forEach((opt, oIdx)=>{
      const optBtn = el(`<button class="opt">${opt}</button>`);
      if (state.answers[idx] === oIdx) optBtn.classList.add("selected");
      if (state.checked){
        optBtn.classList.add("locked");
        if (oIdx === item.correct) optBtn.classList.add("correct");
        else if (state.answers[idx] === oIdx) optBtn.classList.add("incorrect");
      }
      optBtn.onclick = ()=>{
        if (state.checked) return;
        state.answers[idx] = oIdx;
        render();
      };
      optList.appendChild(optBtn);
    });
    qcard.appendChild(optList);
  }

  if (state.checked){
    const ok = isCorrect(item, idx);
    const badge = el(`<div class="qbadge ${ok?'correct':'incorrect'}">
      <span>${ok ? t().correct : t().incorrect}</span>
      ${!ok ? `<span class="why">?</span>` : ``}
    </div>`);
    if (!ok){
      badge.querySelector('.why').onclick = ()=> openModal(item.rule);
    }
    qcard.appendChild(badge);
  }

  return qcard;
}

function syncProgress(){
  const bar = document.querySelector('.progress-fill');
  const text = document.querySelector('.progress-text');
  if (!bar) return;
  const items = currentItems();
  const answeredCount = Object.keys(state.answers).filter(k=>state.answers[k]!==undefined && state.answers[k]!=="").length;
  bar.style.width = (answeredCount/items.length)*100 + "%";
  if (text) text.textContent = `${answeredCount}/${items.length}`;
}

let lastScore = {correct:0,total:0};
function scoreIntoResult(){
  const items = currentItems();
  let correct = 0;
  items.forEach((item, idx)=>{ if (isCorrect(item, idx)) correct++; });
  lastScore = {correct, total: items.length};
}

  const wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.appendChild(backRow(t().backToTypes, ()=>{ state.view={name:"types"}; render(); }));

  wrap.appendChild(el(`<div class="result-card">
    <div class="result-title">${pct>=0.7 ? t().resultGood : t().resultOk}</div>
    <div class="result-score">${lastScore.correct}<span style="color:var(--ink-soft);font-size:24px;"> ${t().of} ${lastScore.total}</span></div>
    <div class="result-sub">${t().topics[state.topic]} · ${t().exTypes[state.exType]}</div>
  </div>`));
  const row = el(`<div class="btn-row">
    <button class="btn ghost" id="retryBtn2">${t().retry}</button>
    <button class="btn" id="toTypesBtn">${t().backToTypes}</button>
  </div>`);

  wrap.querySelector('#toTypesBtn').onclick = ()=>{ state.view={name:"types"}; render(); };
  return wrap;
}

function renderVerbRows(container){
  container.innerHTML = "";
  const q = state.verbsSearch.trim().toLowerCase();
  const filtered = VERBS.filter(v=>{
    if (!q) return true;
    return v.v1.includes(q) || v.v2.join(" ").includes(q) || v.v3.join(" ").includes(q) || v.ru.toLowerCase().includes(q) || v.uz.toLowerCase().includes(q);
  });
  if (filtered.length === 0){
    container.appendChild(el(`<div class="verb-empty">—</div>`));
    return;
  }
  filtered.forEach(v=>{
    container.appendChild(el(`<div class="verb-row">
      <span class="v1">${v.v1}</span><span>${v.v2.join(" / ")}</span><span>${v.v3.join(" / ")}</span><span class="vm">${v.ru} / ${v.uz}</span>
    </div>`));
  });
}

function startVerbGame(){
  const idxs = VERBS.map((_,i)=>i);
  for (let i=idxs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
  state.game = { order: idxs.slice(0,12), pos:0, score:0, streak:0, bestStreak:0, checked:false, v2val:"", v3val:"" };
  render();
}

function renderVerbsGame(){
  const wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.appendChild(backRow(t().backToVerbsHome, ()=>{ state.view={name:"verbsHome"}; render(); }));
  wrap.appendChild(el(`<h2 class="panel-title">${t().verbsGameTitle}</h2>`));

  if (!state.game){
    wrap.appendChild(el(`<div class="bubble" style="max-width:100%;margin-bottom:16px;">${t().verbsGameDesc}</div>`));
    const startBtn = el(`<button class="btn">${t().startGame}</button>`);
    startBtn.onclick = startVerbGame;
    wrap.appendChild(startBtn);
    return wrap;
  }

  const g = state.game;
  const verb = VERBS[g.order[g.pos]];

  wrap.appendChild(el(`<div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" style="width:${(g.pos/g.order.length)*100}%"></div></div>
    <div class="progress-text">${t().roundOf(g.pos+1, g.order.length)}</div>
  </div>`));

  const streakPill = el(`<div class="streak-pill">🔥 ${t().streak}: ${g.streak}</div>`);
  wrap.appendChild(streakPill);

  const card = el(`<div class="verb-card"><div class="verb-v1">${verb.v1}</div></div>`);
  wrap.appendChild(card);

  const v2ok = g.checked && verb.v2.map(x=>x.toLowerCase()).includes(g.v2val.trim().toLowerCase());
  const v3ok = g.checked && verb.v3.map(x=>x.toLowerCase()).includes(g.v3val.trim().toLowerCase());

  const field2 = el(`<div style="margin-bottom:10px;">
    <div class="section-label" style="margin:0 0 6px 2px;">${t().inputV2}</div>
    <input type="text" class="fill-input" style="width:100%;">
  </div>`);
  const in2 = field2.querySelector('input');
  in2.value = g.v2val; in2.disabled = g.checked;
  in2.oninput = ()=>{ g.v2val = in2.value; };
  if (g.checked) in2.classList.add(v2ok ? "correct" : "incorrect");
  wrap.appendChild(field2);

  const field3 = el(`<div style="margin-bottom:6px;">
    <div class="section-label" style="margin:0 0 6px 2px;">${t().inputV3}</div>
    <input type="text" class="fill-input" style="width:100%;">
  </div>`);
  const in3 = field3.querySelector('input');
  in3.value = g.v3val; in3.disabled = g.checked;
  in3.oninput = ()=>{ g.v3val = in3.value; };
  if (g.checked) in3.classList.add(v3ok ? "correct" : "incorrect");
  wrap.appendChild(field3);

  if (g.checked && !(v2ok && v3ok)){
    wrap.appendChild(el(`<div class="qbadge incorrect" style="margin-bottom:10px;">${t().correctAnswer}: ${verb.v2.join(" / ")} — ${verb.v3.join(" / ")}</div>`));
  }

  const actionBar = el(`<div class="action-bar"></div>`);
  if (!g.checked){
    const btn = el(`<button class="btn">${t().check}</button>`);
    btn.onclick = ()=>{
      g.checked = true;
      const ok = verb.v2.map(x=>x.toLowerCase()).includes(g.v2val.trim().toLowerCase()) &&
                 verb.v3.map(x=>x.toLowerCase()).includes(g.v3val.trim().toLowerCase());
      if (ok){ g.score++; g.streak++; g.bestStreak = Math.max(g.bestStreak, g.streak); }
      else { g.streak = 0; }
      render();
    };
    actionBar.appendChild(btn);
  } else {
    const isLast = g.pos === g.order.length - 1;
    const btn = el(`<button class="btn">${isLast ? t().finish : t().next}</button>`);
    btn.onclick = ()=>{
      if (isLast){ state.view = {name:"verbsResult"}; }
      else { g.pos++; g.checked=false; g.v2val=""; g.v3val=""; }
      render();
    };
    actionBar.appendChild(btn);
  }
  wrap.appendChild(actionBar);
  return wrap;
}

function renderVerbsResult(){
  const wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.appendChild(backRow(t().backToVerbsHome, ()=>{ state.game=null; state.view={name:"verbsHome"}; render(); }));
  const g = state.game;
  const pct = g.order.length ? g.score/g.order.length : 0;
  wrap.appendChild(el(`<div class="result-card">
    <div class="result-title">${pct>=0.7 ? t().resultGood : t().resultOk}</div>
    <div class="result-score">${g.score}<span style="color:var(--ink-soft);font-size:24px;"> ${t().of} ${g.order.length}</span></div>
    <div class="result-sub">🔥 ${t().streak}: ${g.bestStreak}</div>
  </div>`));
  const row = el(`<div class="btn-row">
    <button class="btn ghost" id="verbsPlayAgain">${t().playAgain}</button>
    <button class="btn" id="verbsMenuBtn">${t().backToVerbsHome}</button>
  </div>`);
  wrap.appendChild(row);
  wrap.querySelector('#verbsPlayAgain').onclick = ()=>{ startVerbGame(); state.view={name:"verbsGame"}; render(); };
  wrap.querySelector('#verbsMenuBtn').onclick = ()=>{ state.game=null; state.view={name:"verbsHome"}; render(); };
  return wrap;
}

function openModal(ruleKey){
  const ruleText = RULES[state.topic][ruleKey][state.lang];
  const overlay = el(`<div class="modal-overlay">
    <div class="modal">
      <h3>${t().why}</h3>
      <p>${ruleText}</p>
      <button class="close-btn">${t().close}</button>
    </div>
  </div>`);
  overlay.onclick = (e)=>{ if (e.target === overlay) document.body.removeChild(overlay); };
  overlay.querySelector('.close-btn').onclick = ()=> document.body.removeChild(overlay);
  document.body.appendChild(overlay);
}

render();
</script>
</body>
</html>
